name: docker-ci

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

permissions:
  contents: read
  packages: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute base image name
        run: |
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thuai9-base:base" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore base image
        run: |
          docker pull "$BASE_IMAGE" || docker build \
            -f dependency/Dockerfile/Dockerfile_base \
            -t "$BASE_IMAGE" \
            .

      - name: Build server image
        run: |
          docker build \
            -f dependency/Dockerfile/Dockerfile_run_server \
            -t thuai9_server_ci \
            .

      - name: Build Python client image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -f dependency/Dockerfile/Dockerfile_run_client \
            -t thuai9_client_ci \
            .

      - name: Build C++ client image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -f dependency/Dockerfile/Dockerfile_cpp \
            -t thuai9_cpp_ci \
            .
