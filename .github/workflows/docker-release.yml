name: docker-release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image names
        run: |
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thuai9-base:base" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thuai9-run-server:latest" >> "$GITHUB_ENV"
          echo "CLIENT_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thuai9-run-client:latest" >> "$GITHUB_ENV"
          echo "CPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thuai9-cpp:latest" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore base image
        run: |
          docker pull "$BASE_IMAGE" || docker build \
            -f dependency/Dockerfile/Dockerfile_base \
            -t "$BASE_IMAGE" \
            .

      - name: Build and push server image
        run: |
          docker build \
            -f dependency/Dockerfile/Dockerfile_run_server \
            -t "$SERVER_IMAGE" \
            .
          docker push "$SERVER_IMAGE"

      - name: Build and push Python client image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -f dependency/Dockerfile/Dockerfile_run_client \
            -t "$CLIENT_IMAGE" \
            .
          docker push "$CLIENT_IMAGE"

      - name: Build and push C++ client image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -f dependency/Dockerfile/Dockerfile_cpp \
            -t "$CPP_IMAGE" \
            .
          docker push "$CPP_IMAGE"
