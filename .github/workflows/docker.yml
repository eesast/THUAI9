name: docker

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eesast/thuai9_base:base
            dockerfile: dependency/Dockerfile/Dockerfile_base
          - image: thuai9_server_ci
            dockerfile: dependency/Dockerfile/Dockerfile_run_server
          - image: thuai9_client_ci
            dockerfile: dependency/Dockerfile/Dockerfile_run_client
          - image: thuai9_cpp_ci
            dockerfile: dependency/Dockerfile/Dockerfile_cpp

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}" \
            .
