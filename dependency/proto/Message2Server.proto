// Message2Server
syntax = "proto3";
package protobuf;
import "MessageType.proto";

message NullRequest {}

message IDMsg
{
    int64 character_id = 1;
    int64 team_id = 2;
    protobuf.GameMode mode = 3; // 客户端发起连接/请求时声明希望的游戏模式
}


message RegisterFactoryMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    protobuf.GameMode mode = 3;
    int32 preferred_spawn_index = 4; // 客户端希望的出生点索引（0表示不指定，由服务器分配）
    int32 side_flag = 5; // 客户端希望的阵营标识
}

message CreatCharacterMsg
{
    CharacterType character_type = 1;
    int64 team_id = 2;
    int32 birthpoint_index = 3;
    protobuf.GameMode mode = 4;  // 创建角色时可以指明模式
}


message MaterialResourceMsg
{
    int64 character_id = 1;
    int64 team_id = 2;
    int64 resource_id = 3;
    int32 target_x = 4; // 目标坐标，或许可用
    int32 target_y = 5;
    int32 amount = 6; // 采集数量
    //HarvestAction action = 7; // 采集动作类型
}

message MoveMsg
{
    int64 character_id = 1;
    double angle = 2;
    int64 time_in_milliseconds = 3;
    int64 team_id = 4;
}

message SendMsg
{
    int64 character_id = 1;
    int64 to_character_id = 2;
    oneof message
    {
        string text_message = 3;
        bytes binary_message = 4;
    }
    int64 team_id = 5;
}

message AttackMsg // 普通攻击
{
    int64 character_id = 1;
    int64 team_id = 2;
    int32 attack_range = 3; // 攻击范围
    int64 attacked_character_id = 4; // 攻击对象
    int64 attacked_team_id = 5;
}

message AttackFactoryMsg
{
    int64 character_id = 1;
    int64 team_id = 2;
    int32 attack_range = 3;
    int64 attacked_Factory_id = 4;
    int64 attacked_team_id = 5; 
}

message RecoverMsg
{
    int64 character_id = 1;
    int64 recovered_hp = 2;
    int64 team_id = 3;
}

message RepairFactory
{
    int32 character_id = 1;
    int32 team_id = 2;
}

message ProduceProductMeg
{
    ProductType product_type = 1;
    int64 team_id = 2;
    int32 max_produce_num = 3;
}

message LoadMeg
{
    int64 team_id = 1;
    int64 character_id = 2;
    int32 semiconductor_num = 3;
    int32 medicine_num = 4;
    int32 handiwork_num = 5;
    int32 costume_num = 6;
    int32 food_num = 7;

}

message SellMeg
{
    int64 team_id = 1;
    int64 character_id = 2;
    int32 semiconductor_num = 3;
    int32 medicine_num = 4;
    int32 handiwork_num = 5;
    int32 costume_num = 6;
    int32 food_num = 7;
    int32 marketindex = 8;
}


// 智慧大脑相关
message AskAIRequest
{
    int64 team_id = 1;
    int64 character_id = 2;      
    string model = 3;          // 模型标识
    string prompt = 4;         // 自然语言提示
    int32 timeout_ms = 5;      // 超时时间
    bool prefer_structured = 6; // 是否优先返回结构化计划
}

message AIAction
{
    AIActionType type = 1;
    int64 character_id = 2;       // 执行者 
    string target = 3;        // 目标说明
    string payload_json = 4;  // 额外参数（JSON）
    int64 eta_ms = 5;         // 建议在多少毫秒后执行
}

message AskAIResponse
{
    bool act_success = 1;
    string answer_text = 2;   // 自然语言回答
    string plan_json = 3;     // 结构化计划（JSON），便于引擎解析执行
    repeated AIAction actions = 4; // 可直接执行的动作列表（结构化）
    string error_msg = 5; //
}