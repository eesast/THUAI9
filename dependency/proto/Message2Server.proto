    int64 player_id = 1;
    int64 team_id = 2;
    int32 attack_range = 3;
    int64 attacked_Factory_id = 4;
    int64 attacked_team_id = 5; 
}
*/

message OccupyMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    int32 target_x = 3;
    int32 target_y = 4;
    int64 target_compute_center_id = 5;
}

message SendMsg
{
    int64 player_id = 1;
    int64 to_player_id = 2;
    oneof message
    {
        string text_message = 3;
        bytes binary_message = 4;
    }
    int64 team_id = 5;
}


message LoadMeg
{
    int64 team_id = 1;
    int64 player_id = 2;
    int32 semiconductor_num = 3;
    int32 medicine_num = 4;
    int32 handiwork_num = 5;
    int32 costume_num = 6;
    int32 food_num = 7;

}

message SellMeg
{
    int64 team_id = 1;
    int64 player_id = 2;
    int32 semiconductor_num = 3;
    int32 medicine_num = 4;
    int32 handiwork_num = 5;
    int32 costume_num = 6;
    int32 food_num = 7;
    int32 marketindex = 8;
}


message CreateCharacterMsg
{
    CharacterType character_type = 1;
    int64 team_id = 2;
    int32 birthpoint_index = 3;
    protobuf.GameMode mode = 4;  // 创建角色时可以指明模式
}

message ProduceGoodsMeg
{
    GoodsType product_type = 1;
    int64 team_id = 2;
    int32 max_produce_num = 3;
}

message RepairFactoryMeg
{
    int64 player_id = 1;
    int64 team_id = 2;
}



// 智慧大脑相关
message StrategicAIRequest 
{
    int64 team_id = 1;
    int64 current_game_time = 2;
}

message StrategicAIResponse 
{
    bool act_success = 1;
    repeated ProductionSuggestion production_plan = 2;
    repeated TaskSuggestion task_plan = 3;
    string explanation = 4;
}

message ProductionSuggestion 
{
    GoodsType product_type = 1;
    int32 quantity = 2;
}

message TaskSuggestion 
{
    AIActionType action_type = 1;
    int64 character_id = 2;
    int32 target_x = 3;
    int32 target_y = 4;
    int64 target_id = 5;
}