    int64 player_id = 1;
    int64 team_id = 2;
    int32 attack_range = 3;
    int64 attacked_Factory_id = 4;
    int64 attacked_team_id = 5; 
}
*/

message OccupyMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    int32 target_x = 3;
    int32 target_y = 4;
    int64 target_compute_center_id = 5;
}

message SendMsg
{
    int64 player_id = 1;
    int64 to_player_id = 2;
    oneof message
    {
        string text_message = 3;
        bytes binary_message = 4;
    }
    int64 team_id = 5;
}


message LoadMsg
{
    int64 team_id = 1;
    int64 player_id = 2;
    GoodsType product_type = 3;
    int32 product_amount = 4;
}

message TradeMsg
{
    int64 team_id = 1;
    int64 player_id = 2;
    GoodsType product_type = 3;
    int32 product_amount = 4;
    bool is_buy = 5;
}


message CreateCharacterMsg
{
    CharacterType character_type = 1;
    int64 team_id = 2;
    int64 player_id = 3;
    //protobuf.GameMode mode = 5;  // 创建角色时可以指明模式
}

message ProduceGoodsMsg
{
    GoodsType product_type = 1;
    int64 team_id = 2;
    int32 max_produce_num = 3;
}

message UplevelTechMsg
{
    int64 team_id = 1;
    TechType tech_type = 2;
}

//message RepairFactoryMsg
//{
//    int64 player_id = 1;
//    int64 team_id = 2;
//}



// 智慧大脑相关
message StrategicAIRequest 
{
    int64 team_id = 1;
    int64 current_game_time = 2;
    string prompt = 3;
}

message StrategicAIResponse
{
    bool act_success = 1;
    string answer = 2;
    string explanation = 3;
}

message EventStatusRequest
{
    int64 team_id = 1;
    int64 player_id = 2;
}

message EventStatusResponse
{
    bool act_success = 1;
    string event_name = 2;
    string event_description = 3;
}