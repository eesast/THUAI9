// Message2Server
syntax = "proto3";
package protobuf;
import "MessageType.proto";

message NullRequest {}

message IDMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    protobuf.GameMode mode = 3; // 客户端发起连接/请求时声明希望的游戏模式
}

message CharacterMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    CharacterType character_type = 3;
    int32 side_flag = 4;
}

message RegisterFactoryMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    protobuf.GameMode mode = 3;
    int32 preferred_spawn_index = 4; // 客户端希望的出生点索引（0表示不指定，由服务器分配）
    int32 side_flag = 5; // 客户端希望的阵营标识
}

message MoveMsg
{
    int64 player_id = 1;
    double angle = 2;
    int64 time_in_milliseconds = 3;
    int64 team_id = 4;
}

message RecoverMsg
{
    int64 player_id = 1;
    int64 recovered_hp = 2;
    int64 team_id = 3;
}

message ResourceMsg
{
    int64 player_id = 1;
    int64 team_id = 2;
    int64 resource_id = 3;
    int32 target_x = 4; // 目标坐标，或许可用
    int32 target_y = 5;
    int32 amount = 6; // 采集数量
    //HarvestAction action = 7; // 采集动作类型
}

message AttackMsg // 普通攻击
{
    int64 player_id = 1;
    int64 team_id = 2;
    int32 attack_range = 3; // 攻击范围
    int64 attacked_player_id = 4; // 攻击对象
    int64 attacked_team_id = 5;
}

