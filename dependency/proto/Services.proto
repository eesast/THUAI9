syntax = "proto3";
package protobuf;

import "Message2Clients.proto";
import "Message2Server.proto";

service AvailableService
{
    // 连接和初始化服务
    rpc TryConnection(IDMsg) returns (BoolRes);

    // 游戏开局调用一次的服务
    rpc RegisterFactory(RegisterFactoryMsg) returns (stream MessageToClient); // 连接上后等待游戏开始，server会定时通过该服务向所有client发送消息
    rpc GetMap(NullRequest) returns (MessageOfMap);

    // 游戏过程中普通角色执行操作的服务
    rpc Move(MoveMsg) returns (MoveRes);                            // 移动
    rpc Recover(RecoverMsg) returns (BoolRes);                      // 回复
    rpc Harvesting(MaterialResourceMsg) returns (BoolRes);          // 开采原料资源
    rpc Attack(AttackMsg) returns (BoolRes);                        // 普通攻击
    rpc AttackConstruction(AttackFactoryMsg) returns (BoolRes);     // 攻击工厂（基地）
    rpc Repair(RepairFactory) returns (BoolRes);                    // 修理工厂
    rpc Send(SendMsg) returns (BoolRes);                            // 传递信息
    rpc Produce(ProduceGoodsMeg) returns (BoolRes);               // 生产产品
    rpc Load(LoadMeg) returns (BoolRes);                            // 装载产品
    rpc Sell(SellMeg) returns (BoolRes);                            // 出售产品

    // 游戏过程中核心角色（工厂）可以另外执行操作的服务
    rpc CreatCharacter(CreateCharacterMsg) returns (BoolRes);        // 创建角色
    rpc CreatCharacterRID(CreateCharacterMsg) returns (CreatCharacterRes); // 获取角色编号
    rpc EndAllAction(IDMsg) returns (BoolRes);                      // 结束所有动作

    // 智慧大脑
    rpc AskAI(StrategicAIRequest) returns (StrategicAIResponse);      // 客户端请求AI建议
}