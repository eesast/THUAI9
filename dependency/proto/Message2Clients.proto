// Message2Client
syntax = "proto3";
package protobuf;

import "MessageType.proto";

message MessageOfCharacter
{
    int64 guid = 1;

    int64 team_id = 2;
    int64 player_id = 3;

    protobuf.CharacterType character_type = 4;

    // 主动状态
    protobuf.CharacterState character_active_state = 5;

    // 位置
    int32 x = 6;
    int32 y = 7;

    double facing_direction = 8;
    int32 speed = 9;
    int32 view_range = 10;

    int32 common_attack = 11;
    int64 common_attack_cd = 12;
    int32 common_attack_range = 13;

    int32 hp = 14; 

    int32 carry_capacity = 15; // 负重上限，产品数量为单位
    int32 current_load = 16; // 当前负重
    int32 harvest_rate_per_sec = 17; // 每秒采集量
}


message MessageOfResource
{
    protobuf.ResourceType resource_type = 1;
    protobuf.ResourceState resource_state = 2;

    int32 x = 3;
    int32 y = 4;

    int32 remaining_amount = 5; // 采集进度 等价于血量

    int32 id = 6;
    int32 max_amount = 7;
}

message MessageOfMap
{
    uint32 height = 1;
    uint32 width = 2;
    message Row
    {
        repeated PlaceType cols = 1;
    }
    repeated Row rows = 3;
}

message MessageOfTeam
{
    int64 team_id = 1;
    int64 player_id = 2;
    int32 score = 3;
    int32 material = 4;
    int32 compute_power = 5;
    map<string, int32> tech_levels = 6; // 例如：Efficiency、Robust、Warrior 等
}

message MessageOfFactory
{
    int64 factory_id = 1;
    int64 team_id = 2;

    int32 x = 3;
    int32 y = 4;

    int32 hp = 5;
    int32 robust = 6;

    int32 storage = 7;
    int32 efficiency = 8;

    int64 source = 9;
    int64 computing_power = 10;

    bool can_produce = 11;
    bool can_recruit = 12;

    message GoodsStack
    {
        protobuf.GoodsType product_type = 1;
        int32 quantity = 2;
    }

    repeated GoodsStack product_inventory = 13;

}

message MessageOfMarket
{
    int64 market_id = 1;

    int32 x = 2;
    int32 y = 3;

    protobuf.MarketType market_type = 4;

    message PriceEntry
    {
        protobuf.GoodsType goods_type = 1;
        int32 price = 2;
        int32 traded_quantity = 3;
    }

    repeated PriceEntry price_list = 5;
}

message MessageOfComputeCenter
{
    int64 center_id = 1;
    int32 x = 2;
    int32 y = 3;
    int64 owner_team_id = 4; // 0表示无人占领
    int32 occupy_progress = 5; // 占领进度
}

message MessageOfBarrier
{
    int64 barrier_id = 1;
    int32 x = 2;
    int32 y = 3;
}

message MessageOfBush
{
    int64 bush_id = 1;
    int32 x = 2;
    int32 y = 3;
    int32 radius = 4;
}

// 智慧大脑事件 
message GlobalAIEvent {
    int64 event_id = 1;
    int64 trigger_time_ms = 2;
    protobuf.AIEventCategory category = 3;
    string title = 4;
    string description = 5;
}

// 世界修正
message AIWorldEffect {
    int64 event_id = 1;
    int64 duration_ms = 2;

    repeated ProductPriceModifier price_modifiers = 3;
    repeated CharacterAttributeModifier character_modifiers = 4;
    repeated TaskTimeModifier task_modifiers = 5;
}

message ProductPriceModifier {
    protobuf.GoodsType goods_type = 1;
    double multiplier = 2;
}

message CharacterAttributeModifier {
    protobuf.CharacterType character_type = 1;
    double speed_multiplier = 2;
    double damage_multiplier = 3;
    double hp_multiplier = 4;
}

message TaskTimeModifier {
    protobuf.TaskType task_type = 1;
    double time_multiplier = 2;
}

message MessageOfObj
{
    oneof message_of_obj
    {
        MessageOfFactory factory_message = 1;
        MessageOfCharacter character_message = 2;
        MessageOfResource resource_message= 3;
        MessageOfMarket market_message = 4;
        MessageOfComputeCenter compute_center_message = 5;
        MessageOfMap map_message = 6;
        MessageOfNews news_message = 7;
        MessageOfTeam team_message = 8;
        MessageOfBarrier barrier_message = 9;
        MessageOfBush bush_message = 10;
    }
}


message MessageOfAll
    {
        int32 game_time = 1;

        message TeamInfo {
            int32 score = 1;
            int32 material = 2;
            int32 compute_power = 3;
            int32 factory_hp = 4;
            map<string, int32> tech_levels = 5; // 与服务端内部科技名一致
        }

        repeated TeamInfo teams = 2; // teams[0] 对应 team1，teams[1] 对应 team2 ...
    }


message MessageToClient
{
    repeated MessageOfObj obj_message = 1;
    protobuf.GameState game_state = 2;
    MessageOfAll all_message = 3;

    //protobuf.GameMode game_mode = 3;   

    //GlobalAIEvent ai_event = 5;
    //AIWorldEffect ai_effect = 6;

}


message MoveRes // 如果打算设计撞墙保留平行速度分量，且需要返回值则可用这个（大概没啥用）
{
    int64 actual_speed = 1;
    double actual_angle = 2;
    bool act_success = 3;
}

message CreatCharacterRes
{
    bool act_success = 1;
    int64 player_id = 2;
}

message BoolRes
{
    bool act_success = 1;
}

message CharacterInfoRes
{
    repeated MessageOfCharacter Character_info = 1;
}

message EcoRes
{
    int64 economy = 1;
}

message MessageOfNews
{
    oneof news // 一条新闻
    {
        string text_message = 1;
        bytes binary_message = 2;
    }
    int64 from_id = 3;
    int64 to_id = 4;
    int64 team_id = 5;
}

